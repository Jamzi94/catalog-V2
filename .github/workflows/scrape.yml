name: Scrape dlpsgame PS5 catalog

on:
  schedule:
    # Tous les 2 jours à 04:00 UTC (06:00 Paris en été / 05:00 en hiver).
    # */2 = jours impairs du mois (1,3,5,…,31) — léger chevauchement aux
    # changements de mois (31→1), acceptable. L'incrémental rend les runs rapides.
    - cron: "0 4 */2 * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Nombre max de pages de catégorie à parcourir (vide = tout)"
        required: false
        default: ""
      max_games:
        description: "Nombre max de jeux à scraper (vide = tout)"
        required: false
        default: ""
      no_cache:
        description: "Désactiver le cache disque (force le re-scrap complet)"
        type: boolean
        required: false
        default: false
      scrape_mode:
        description: "Mode de scraping (full = tout, incremental = seulement les nouveaux/modifiés)"
        type: choice
        options:
          - incremental
          - full
        required: false
        default: incremental
      skip_superpsx:
        description: "Ignorer la source SuperPSX"
        type: boolean
        required: false
        default: false
      skip_wp_api:
        description: "Ignorer l'API WordPress (forcer le scraper HTML)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: scrape-dlpsgame
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # ITEM 4 : un run réel prend ~3h30 aujourd'hui (avant les optimisations de
    # parallélisation). On borne à 180 min pour ne pas le tuer pendant la
    # transition, tout en évitant les jobs zombies (l'ancien 1200 était excessif).
    timeout-minutes: 180

    services:
      # FlareSolverr résout les challenges Cloudflare via un vrai Chrome
      # non-headless. Les IP datacenter de GitHub Actions sont bloquées
      # par Cloudflare (403), donc on a besoin de ce proxy.
      # ITEM 12 : 3 instances (8191/8192/8193) pour alimenter le pool round-robin
      # du fallback HTML (FLARESOLVERR_URLS). 8191 reste l'instance nominale.
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
        options: >-
          --health-cmd "curl -fs http://localhost:8191/health | grep -q ok"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      flaresolverr2:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8192:8191
        env:
          LOG_LEVEL: info
        options: >-
          --health-cmd "curl -fs http://localhost:8191/health | grep -q ok"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      flaresolverr3:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8193:8191
        env:
          LOG_LEVEL: info
        options: >-
          --health-cmd "curl -fs http://localhost:8191/health | grep -q ok"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # Instances 4 et 5 : accélèrent SuperPSX (pool concurrency 5). LOG_LEVEL
      # warning pour limiter le bruit. ~5 Chrome max raisonnable sur un runner 7 Go.
      flaresolverr4:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8194:8191
        env:
          LOG_LEVEL: warning
        options: >-
          --health-cmd "curl -fs http://localhost:8191/health | grep -q ok"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      flaresolverr5:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8195:8191
        env:
          LOG_LEVEL: warning
        options: >-
          --health-cmd "curl -fs http://localhost:8191/health | grep -q ok"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 (historique complet) : indispensable pour que le step
          # « Commit & push » puisse pousser/rebaser de façon fiable. En shallow
          # (depth 1), un push depuis une branche échouait ("shallow update not
          # allowed") et le rebase de secours n'avait pas de base commune.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run module self-tests
        run: |
          # Garde-fous : les auto-tests sortent != 0 en cas de régression
          # (notamment le bug de taille « to » et la taxonomie des formats).
          python3 scripts/sizes.py
          python3 scripts/formats.py

      - name: Determine scrape mode
        id: config
        run: |
          # ITEM 11 : mode incremental par défaut. Le full devient MENSUEL
          # (1er jour du mois) au lieu d'hebdomadaire (lundi) : l'incrémental réel
          # piloté par 'modified' rend le full hebdo superflu et coûteux.
          # workflow_dispatch + choix manuel (scrape_mode=full) restent prioritaires.
          MODE="${{ github.event.inputs.scrape_mode || 'incremental' }}"
          if [ "$(date +%d)" = "01" ] && [ "$MODE" = "incremental" ]; then
            echo "  1er du mois détecté → mode full mensuel forcé"
            MODE="full"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "  Mode de scraping : $MODE"

      - name: Restore scrape cache + manifest
        uses: actions/cache@v4
        with:
          path: |
            .scrape_cache
            .scrape_cache_api
            .scrape_cache_superpsx
            .scrape_manifest.json
            .scrape_manifest_api.json
            .scrape_manifest_superpsx.json
            .scrape_manifest_exfat.json
          # ITEM 2 : clé STABLE (v1) au lieu de github.run_id. Une clé unique par run
          # ne réutilisait jamais le cache écrit (toujours un miss restauré via
          # restore-keys, jamais de re-save sur la même clé) → l'incrémental et le
          # cache de résolution restaient factices. Clé stable = vrai cache entre runs.
          key: scrape-cache-${{ runner.os }}-v1
          restore-keys: |
            scrape-cache-${{ runner.os }}-

      - name: Wait for FlareSolverr
        run: |
          # ITEM 12 : on attend les 3 instances (8191/8192/8193). 8191 est
          # bloquante (instance nominale) ; 8192/8193 alimentent le pool round-robin
          # du fallback HTML — on les attend aussi pour exporter FLARESOLVERR_URLS.
          for port in 8191 8192 8193 8194 8195; do
            echo "Attente du démarrage de FlareSolverr sur le port $port..."
            ready=0
            for i in $(seq 1 60); do
              if curl -sf "http://localhost:${port}/health" > /dev/null 2>&1; then
                echo "  FlareSolverr ($port) est prêt !"
                ready=1
                break
              fi
              echo "  tentative $i/60 — FlareSolverr ($port) pas encore prêt..."
              sleep 5
            done
            if [ "$ready" != "1" ]; then
              if [ "$port" = "8191" ]; then
                echo "ERREUR: FlareSolverr nominal (8191) n'a pas démarré à temps"
                exit 1
              fi
              echo "::warning::FlareSolverr ($port) indisponible — le pool tournera en mode dégradé."
            fi
          done
          # Construit la liste CSV des instances RÉELLEMENT en bonne santé pour le pool.
          URLS=""
          for port in 8191 8192 8193 8194 8195; do
            if curl -sf "http://localhost:${port}/health" > /dev/null 2>&1; then
              URLS="${URLS:+$URLS,}http://localhost:${port}/v1"
            fi
          done
          echo "FLARESOLVERR_URLS=$URLS" >> "$GITHUB_ENV"
          echo "  Pool FlareSolverr : $URLS"

      - name: Test FlareSolverr with dlpsgame.com
        continue-on-error: true
        run: |
          echo "Test de résolution Cloudflare sur dlpsgame.com..."
          RESPONSE=$(curl -s -X POST http://localhost:8191/v1 \
            -H "Content-Type: application/json" \
            -d '{"cmd":"request.get","url":"https://dlpsgame.com/category/ps5/","maxTimeout":60000}')
          echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(f\"  FlareSolverr status: {data.get('status')}\")
          sol = data.get('solution', {})
          print(f\"  HTTP status: {sol.get('status')}\")
          html = sol.get('response', '')
          print(f\"  HTML length: {len(html)}\")
          if 'Just a moment' in html[:500]:
            print('  ⚠ Challenge Cloudflare NON résolu')
            sys.exit(1)
          else:
            print('  ✓ Challenge Cloudflare résolu')
          "

      # ──────────────────────────────────────────────────────────────
      # SOURCE 1 : dlpsgame.com via API WordPress (avec fallback FlareSolverr)
      # ──────────────────────────────────────────────────────────────
      - name: Demarrer SuperPSX en tache de fond
        id: superpsx_fond
        if: ${{ !cancelled() && github.event.inputs.skip_superpsx != 'true' }}
        env:
          FLARESOLVERR_URL: http://localhost:8191/v1
        run: |
          # PARALLELISATION. Mesure du run 33280162599, 49 minutes au total :
          #   scrape dlpsgame (WP API) .... 26 min 49
          #   scrape SuperPSX ............. 20 min 31
          #   les onze autres etapes ...... moins de 15 s CUMULEES
          # Les deux scrapes sont INDEPENDANTS — sources differentes, caches
          # differents, fichiers de sortie differents — mais tournaient l'un
          # apres l'autre. SuperPSX demarre donc ici, en fond, et l'etape
          # « Scrape SuperPSX » plus bas se contente de l'attendre. On ne peut
          # pas faire l'inverse : le fallback HTML de dlpsgame depend du
          # resultat de l'etape API, qui doit donc rester au premier plan.
          # Les cinq instances FlareSolverr absorbent la charge des deux.
          ARGS=("--out" "superpsx-ps5.fresh.json")
          ARGS+=("--mode" "${{ steps.config.outputs.mode }}")
          ARGS+=("--http-backend" "flaresolverr")
          ARGS+=("--flaresolverr-url" "http://localhost:8191/v1")
          ARGS+=("--concurrency" "5")
          if [ -n "${{ github.event.inputs.max_games }}" ]; then
            ARGS+=("--max-games" "${{ github.event.inputs.max_games }}")
          fi
          ARGS+=("--verbose")
          nohup python scripts/scrape_superpsx.py "${ARGS[@]}" > superpsx.log 2>&1 &
          echo $! > superpsx.pid
          echo "SuperPSX lance en fond (pid $(cat superpsx.pid))"

      - name: Demarrer les releves de noms en tache de fond
        if: ${{ !cancelled() }}
        run: |
          # POURQUOI SI TOT. Les trois collectes lisent le catalogue pour savoir
          # QUELS liens n'ont pas encore de nom, puis passent tout leur temps a
          # attendre le reseau. Elles n'ont besoin ni du scrape, ni du merge :
          # les liens a nommer sont deja dans le catalogue du depot. Les laisser
          # apres le merge les mettait sur le chemin critique pour rien.
          #
          # Mesure qui l'a rendu evident : en mode incremental, « Scrape
          # dlpsgame via WP API » prend 1 SECONDE (cache restaure) et SuperPSX
          # 20 minutes. Tout ce qui s'ajoute apres eux s'ajoute au total.
          #
          # CE QUE ÇA COUTE, ET C'EST ASSUME : un lien decouvert par CE run ne
          # sera nomme qu'au SUIVANT, puisque la collecte a demarre avant de le
          # connaitre. Un run de retard sur les nouveautes contre une quinzaine
          # de minutes sur chaque run — et le releve est incremental, donc le
          # retard ne s'accumule pas.
          #
          # La collecte lit une COPIE figee : le merge et les sondes de taille
          # reecrivent ps5-catalog.json pendant ce temps, et lire un fichier en
          # cours de reecriture rend du JSON tronque une fois sur mille. Une
          # copie coute 6 Mo et supprime la course.
          if [ ! -f ps5-catalog.json ]; then
            echo "Pas de catalogue au depart — rien a relever."
            exit 0
          fi
          cp ps5-catalog.json catalogue-au-depart.json
          # SEULE la collecte en HTTP DIRECT part ici. akirabox et buzzheavier
          # passent par FlareSolverr, dont SuperPSX se sert au meme moment : les
          # mettre en concurrence sur les cinq instances ralentirait peut-etre
          # les deux, et je n'ai AUCUNE mesure de FlareSolverr sous trois
          # consommateurs. Ils partent donc plus bas, une fois le pool libre.
          # Si une mesure montre que la contention est negligeable, les remonter
          # ici est un copier-coller.
          rm -f releve-*.json log-releve-*.txt
          nohup python3 scripts/relever_noms.py catalogue-au-depart.json --max 1200                 --releves releve-lisibles.json > log-releve-lisibles.txt 2>&1 &
          echo $! > releve-lisibles.pid
          echo "Collecte des hebergeurs lisibles lancee en fond."


      - name: Scrape dlpsgame via WP API
        id: wp_api
        continue-on-error: true
        timeout-minutes: 120
        env:
          FLARESOLVERR_URL: http://localhost:8191/v1
        run: |
          if [ "${{ github.event.inputs.skip_wp_api }}" = "true" ]; then
            echo "API WordPress ignorée (skip_wp_api=true)"
            echo "games=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "=== Scraping via API WordPress ==="
          ARGS=("--out" "ps5-catalog.fresh.json")
          ARGS+=("--flaresolverr-url" "http://localhost:8191/v1")
          ARGS+=("--mode" "${{ steps.config.outputs.mode }}")
          # ITEM 8 : pré-résolution concurrente des redirections (le correctif du 3h30).
          ARGS+=("--redirect-concurrency" "32")
          if [ -n "${{ github.event.inputs.max_pages }}" ]; then
            ARGS+=("--max-pages" "${{ github.event.inputs.max_pages }}")
          fi
          if [ -n "${{ github.event.inputs.max_games }}" ]; then
            ARGS+=("--max-games" "${{ github.event.inputs.max_games }}")
          fi
          if [ "${{ github.event.inputs.no_cache }}" = "true" ]; then
            ARGS+=("--no-cache")
          fi
          ARGS+=("--verbose")
          python scripts/scrape_wp_api.py "${ARGS[@]}"

          # ITEM 1 : on expose le nombre de jeux produits pour décider du fallback HTML.
          N=$(python3 -c "import json; print(len(json.load(open('ps5-catalog.fresh.json')).get('packages',[])))" 2>/dev/null || echo 0)
          echo "  WP API : $N jeux produits"
          echo "games=$N" >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────────────────────
      # SOURCE 1b : dlpsgame.com via scraper HTML (fallback si API échoue)
      # ──────────────────────────────────────────────────────────────
      - name: Scrape dlpsgame via HTML (fallback)
        # ITEM 1 : fallback déclenché si l'API a vraiment ÉCHOUÉ, ou si elle n'a
        # produit aucun jeu EN MODE FULL (en incrémental, 0 jeu modifié est NORMAL,
        # pas un échec → on ne relance pas un scrape HTML complet pour rien), ou si
        # l'opérateur force le HTML via skip_wp_api=true.
        # continue-on-error : un échec du fallback ne doit PAS tuer les autres
        # sources (SuperPSX/exFAT) ni le merge ; le garde-fou merge protège les données.
        if: ${{ steps.wp_api.outcome == 'failure' || (steps.wp_api.outputs.games == '0' && steps.config.outputs.mode == 'full') || github.event.inputs.skip_wp_api == 'true' }}
        continue-on-error: true
        timeout-minutes: 150
        env:
          FLARESOLVERR_URL: http://localhost:8191/v1
        run: |
          echo "=== API indisponible/vide — fallback vers scraper HTML ==="
          ARGS=("--http-backend" "flaresolverr")
          ARGS+=("--flaresolverr-url" "http://localhost:8191/v1")
          # ITEM 12 : 3 voies via le pool round-robin (FLARESOLVERR_URLS exporté plus haut).
          ARGS+=("--concurrency" "3")
          ARGS+=("--mode" "${{ steps.config.outputs.mode }}")
          ARGS+=("--checkpoint-every" "50")
          if [ -n "${{ github.event.inputs.max_pages }}" ]; then
            ARGS+=("--max-pages" "${{ github.event.inputs.max_pages }}")
          fi
          if [ -n "${{ github.event.inputs.max_games }}" ]; then
            ARGS+=("--max-games" "${{ github.event.inputs.max_games }}")
          fi
          if [ "${{ github.event.inputs.no_cache }}" = "true" ]; then
            ARGS+=("--no-cache")
          fi
          ARGS+=("--out" "ps5-catalog.fresh.json")
          ARGS+=("--verbose")
          python scripts/scrape_dlpsgame.py "${ARGS[@]}"

      # ──────────────────────────────────────────────────────────────
      # SOURCE 2 : superpsx.com (DERRIÈRE Cloudflare → FlareSolverr requis)
      # ──────────────────────────────────────────────────────────────
      - name: Scrape SuperPSX
        continue-on-error: true
        # Source indépendante : tourne même si le chemin dlpsgame a échoué (!cancelled).
        if: ${{ !cancelled() && github.event.inputs.skip_superpsx != 'true' }}
        timeout-minutes: 90
        env:
          FLARESOLVERR_URL: http://localhost:8191/v1
        run: |
          echo "=== Scraping SuperPSX (FlareSolverr) ==="
          # superpsx.com est passé derrière Cloudflare (403 en curl direct) → FlareSolverr.
          # Les liens de DL sont des "link-lockers" keepshield.org, résolus en vrais
          # miroirs (vikingfile/1fichier…) via FlareSolverr (JS rendu).
          # FLARESOLVERR_URLS (pool 3 instances) est exporté plus haut → la concurrence
          # est automatiquement plafonnée à la taille du pool.
          # Il tourne depuis l'etape « Demarrer SuperPSX en tache de fond »,
          # lancee avant le scrape dlpsgame : ici on ATTEND, on ne relance pas.
          if [ ! -f superpsx.pid ]; then
            echo "Aucun processus SuperPSX en fond — rien a attendre."
            exit 0
          fi
          PID=$(cat superpsx.pid)
          echo "Attente de SuperPSX (pid $PID)…"
          # Attente BORNEE et BAVARDE. Bornee : sans plafond ici, un scrape
          # bloque laissait le job tourner jusqu'au timeout-minutes ci-dessus,
          # 80 minutes a ne rien faire. Bavarde : le journal ne sortait qu'a la
          # FIN, donc pendant tout ce temps l'etape n'affichait rien et on ne
          # pouvait pas distinguer « ça avance » de « c'est mort ».
          PLAFOND=$((70 * 60)); ECOULE=0
          while kill -0 "$PID" 2>/dev/null; do
            sleep 30; ECOULE=$((ECOULE + 30))
            if [ $((ECOULE % 120)) -eq 0 ]; then
              echo "  … $((ECOULE / 60)) min — $(tail -n 1 superpsx.log 2>/dev/null)"
            fi
            if [ $ECOULE -ge $PLAFOND ]; then
              echo "::warning::SuperPSX depasse 70 min — arret, on garde ce qui existe."
              kill "$PID" 2>/dev/null || true; sleep 5; break
            fi
          done
          echo "=== journal SuperPSX ==="
          cat superpsx.log || true
          # Le fichier de sortie est le seul juge : un scrape qui n'a rien
          # produit ne doit pas passer pour un succes silencieux.
          if [ -s superpsx-ps5.fresh.json ]; then
            N=$(python3 -c "import json;print(len(json.load(open('superpsx-ps5.fresh.json')).get('packages',[])))" 2>/dev/null || echo 0)
            echo "SuperPSX : $N jeux produits"
          else
            echo "SuperPSX : aucun fichier produit"
          fi

      # ──────────────────────────────────────────────────────────────
      # SOURCE 3 : exFAT JSON distant (non-bloquant)
      # ──────────────────────────────────────────────────────────────
      - name: Import exFAT source
        continue-on-error: true
        # Source indépendante : tourne même si un chemin précédent a échoué.
        if: ${{ !cancelled() }}
        run: |
          # Source secondaire (non-bloquante). Si elle échoue, on continue avec
          # uniquement dlpsgame ; l'étape de fusion gère l'absence du fichier.
          # Mémoire incrémentale : import sauté si le JSON distant est inchangé
          # (ETag/Last-Modified/hash, état dans .scrape_manifest_exfat.json).
          ARGS=("--out" "exfat-ps5.fresh.json" "--verbose")
          if [ "${{ github.event.inputs.no_cache }}" = "true" ] || [ "${{ steps.config.outputs.mode }}" = "full" ]; then
            ARGS+=("--force")
          fi
          python scripts/import_exfat.py "${ARGS[@]}"

      # ──────────────────────────────────────────────────────────────
      # FUSION INCRÉMENTALE
      # ──────────────────────────────────────────────────────────────
      - name: Merge fresh sources into existing catalog (incremental)
        # Tourne même si le chemin dlpsgame a échoué : SuperPSX/exFAT peuvent avoir
        # produit des données ; le garde-fou merge conserve l'existant si tout est vide.
        if: ${{ !cancelled() }}
        run: |
          OUT=ps5-catalog.json
          FRESHES=()

          # On collecte les sources fraîches RÉELLEMENT produites et non vides.
          for f in ps5-catalog.fresh.json exfat-ps5.fresh.json superpsx-ps5.fresh.json; do
            if [ -f "$f" ]; then
              N=$(python3 -c "import json; print(len(json.load(open('$f')).get('packages',[])))" 2>/dev/null || echo 0)
              echo "  $f : $N jeux"
              if [ "$N" -gt 0 ]; then FRESHES+=("$f"); fi
            fi
          done

          # SÉCURITÉ : si AUCUNE source n'a produit de jeu, le catalogue existant
          # est conservé intact (jamais écrasé par un cycle où tout a échoué).
          if [ ${#FRESHES[@]} -eq 0 ]; then
            echo "::warning::Aucune source fraîche exploitable — catalogue existant conservé intact."
            rm -f ps5-catalog.fresh.json exfat-ps5.fresh.json superpsx-ps5.fresh.json
            echo "MERGE_SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi

          # ITEM 6 : merge_catalogs.py applique un garde-fou anti-corruption.
          # Codes de sortie : 0=OK (fusion écrite), 2=entrée invalide,
          # 3=run dégradé refusé. Sur rc!=0, AUCUN fichier de sortie n'est écrit
          # et l'existant reste intact → on saute le commit (MERGE_SKIPPED=1).
          # En full mensuel, on passe --full pour désactiver le seuil de rétrécissement.
          MERGE_FLAGS=()
          if [ "${{ steps.config.outputs.mode }}" = "full" ]; then
            MERGE_FLAGS+=("--full")
          fi

          # Sauvegarder le catalogue existant pour le diff
          if [ -f "$OUT" ]; then
            cp "$OUT" ps5-catalog.previous.json
            # Fusion incrémentale : sources fraîches d'abord (métadonnées à jour),
            # catalogue existant ensuite (préserve jeux disparus, miroirs accumulés,
            # et tout l'enrichissement RAWG via _enrichedAt / metadata).
            echo "Fusion incrémentale dans $OUT (sources : ${FRESHES[*]}, existant)…"
            if python3 scripts/merge_catalogs.py ps5-catalog.merged.json "${MERGE_FLAGS[@]}" "${FRESHES[@]}" "$OUT"; then
              mv ps5-catalog.merged.json "$OUT"
            else
              rc=$?
              echo "::warning::Merge refusé (rc=$rc) — catalogue existant conservé intact, commit ignoré."
              rm -f ps5-catalog.merged.json ps5-catalog.previous.json
              rm -f ps5-catalog.fresh.json exfat-ps5.fresh.json superpsx-ps5.fresh.json
              echo "MERGE_SKIPPED=1" >> "$GITHUB_ENV"
              exit 0
            fi
          else
            echo "Premier run : initialisation du catalogue depuis les sources fraîches."
            python3 scripts/merge_catalogs.py "$OUT" "${MERGE_FLAGS[@]}" "${FRESHES[@]}"
          fi

          rm -f ps5-catalog.fresh.json exfat-ps5.fresh.json superpsx-ps5.fresh.json

          # On aligne le nom du fichier de warnings sur le catalogue canonique.
          if [ -f ps5-catalog.fresh.warnings.txt ]; then
            mv -f ps5-catalog.fresh.warnings.txt ps5-catalog.warnings.txt
          fi

      # ──────────────────────────────────────────────────────────────
      # ENRICHISSEMENT RAWG (TTL dynamique)
      # ──────────────────────────────────────────────────────────────
      - name: Enrich metadata (RAWG, dynamic TTL)
        if: env.MERGE_SKIPPED != '1'
        timeout-minutes: 30
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          # Enrichissement avec TTL dynamique :
          # - Nouveaux jeux : enrichis immédiatement
          # - Matchés RAWG : rafraîchis tous les 30 jours (ITEM 3 : ttl 3 → 30)
          # - Non matchés : réessayés tous les 14 jours
          # Sans secret RAWG_API_KEY, le script ne fait rien.
          # NB : RAWG sert UNIQUEMENT aux métadonnées (note, genres, date,
          # metacritic). Il ne fournit PAS de jaquette → ne touche plus posterUrl.
          # ITEM 9 : --concurrency 4 (débit global auto-borné ~5 req/s par token-bucket).
          if [ -f ps5-catalog.json ]; then
            python3 scripts/enrich_rawg.py ps5-catalog.json --ttl-days 30 --max-calls 900 --concurrency 4
          fi

      # ──────────────────────────────────────────────────────────────
      # ENRICHISSEMENT JAQUETTES (IGDB) — vraies covers portrait
      # ──────────────────────────────────────────────────────────────
      - name: Enrich covers (IGDB)
        if: env.MERGE_SKIPPED != '1'
        continue-on-error: true
        timeout-minutes: 30
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          # Récupère la VRAIE jaquette PS5 (cover portrait) depuis IGDB et la
          # pose dans posterUrl. Sans secrets TWITCH_CLIENT_ID/SECRET, no-op.
          # En l'absence de jaquette IGDB, on garde la cover scrapée du site.
          # ITEM 9 : --concurrency 3 (débit plafonné STRICTEMENT à 4 req/s par token-bucket).
          if [ -f ps5-catalog.json ]; then
            # --max-calls 900 : couvre tout le catalogue (~840) en un seul run
            # (4 req/s strict → ~4 min) ; fini les jeux « reportés (plafond) ».
            # --recheck-unmatched : ré-essaie les « non trouvés » à chaque run
            # (matching nettoyé + IGDB s'enrichit) ; les matchés restent cachés.
            python3 scripts/enrich_igdb.py ps5-catalog.json --ttl-days 30 \
              --max-calls 900 --concurrency 3 --recheck-unmatched
          fi

      # ──────────────────────────────────────────────────────────────
      # SONDAGE DES TAILLES (hébergeurs fiables sans clé)
      # ──────────────────────────────────────────────────────────────
      - name: Probe hoster sizes
        if: env.MERGE_SKIPPED != '1'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          # Complète les sizeBytes manquants en interrogeant vikingfile/mega/
          # gofile/mediafire (octets exacts, sans téléchargement). Non bloquant.
          # ITEM 9 : --concurrency 6 (hébergeurs distincts, pas de rate-limit strict).
          if [ -f ps5-catalog.json ]; then
            # --retry-ttl-days 0 : ré-essaie à chaque run les jeux sondés sans
            # succès (le cache de tailles est éphémère ; le set est petit et se
            # vide à mesure que les tailles tombent). Récupère vikingfile/mediafire.
            python3 scripts/hoster_size.py --catalog ps5-catalog.json --max 400 \
              --concurrency 6 --retry-ttl-days 0
          fi


      - name: Sonder la taille des liens Backport
        if: env.MERGE_SKIPPED != '1'
        run: |
          # Un lien « BP » est tantot le JEU repackage, tantot le seul binaire a
          # deposer dans le dossier du jeu. Mesure du 2026-08-30 sur 114 tailles
          # relevees : distribution bimodale, 49 sous 100 Mo contre 58 au-dessus
          # de 1 Go, UN SEUL lien dans la vallee 133-307 Mo. On sonde UNE taille
          # par rubrique (les miroirs d'une rubrique sont le meme fichier) :
          # 953 requetes la premiere fois, puis le cache disque les ressert.
          # pegasus_finalize propage ensuite aux miroirs et affiche la taille
          # sous le seuil. Une panne d'hebergeur laisse le lien indetermine :
          # elle ne doit pas casser le run.
          if [ -f ps5-catalog.json ]; then
            python3 - <<'PY' || true
          import json, sys
          sys.path.insert(0, "scripts")
          import hoster_size as H
          cat = json.load(open("ps5-catalog.json", encoding="utf-8"))
          st = H.fill_link_sizes(cat, max_probe=500, delay=0.2)
          print("tailles de liens :", st)
          json.dump(cat, open("ps5-catalog.json", "w", encoding="utf-8"),
                    ensure_ascii=False, indent=2)
          PY
          fi

      - name: Attendre les releves de noms et les appliquer
        if: env.MERGE_SKIPPED != '1'
        timeout-minutes: 40
        run: |
          # ETAPE CENTRALE depuis le 2026-08-30 : l'etiquette d'un lien se
          # construit avec ce que dit le FICHIER, pas seulement la page source.
          # Mesure par ablation sur les 15743 liens du catalogue — on retire le
          # nom de fichier et on regarde ce que l'etiquette perd :
          #   DLC ............ 1139 -> 732   (+55 %)
          #   region ......... 8359 -> 5536  (+51 %)
          #   partie « n/N » ..   89 ->   44  (x2)
          # BP et version, eux, ne bougent pas d'un lien : ils viennent de la
          # page source. Chaque source sert a quelque chose de PRECIS.
          #
          # Les collectes tournent depuis l'etape « Demarrer les releves de noms
          # en tache de fond ». Ici on attend, on verse, on ne relance pas.
          #
          # Chacune ecrit son propre releve, et pas le catalogue. Avant ça elles
          # le reecrivaient toutes EN ENTIER : lancees ensemble, la derniere a
          # fermer le fichier effaçait le travail des autres — sans erreur, sans
          # JSON casse, avec un catalogue parfaitement valide a l'arrivee.
          # Le pool FlareSolverr est libre depuis « Scrape SuperPSX » : akirabox
          # et buzzheavier partent MAINTENANT, en parallele l'un de l'autre.
          # buzzheavier prend ses 243 liens en UN lot depuis le 2026-08-30 : la
          # buzzheavier LIMITE LE DEBIT, mesure du 2026-08-30 : 39 pages tirees
          # d'affilee au navigateur rendent 20 x HTTP 404 (fichiers morts),
          # 17 x HTTP 429 « Too Many Requests » et 2 x 200. Les 429 venaient de
          # MON balayage, pas du site : c'est le debit qui plafonnait le taux a
          # 46 noms sur 217, pas le parseur ni des liens morts. D'ou deux fils
          # et une pause d'une seconde et demie, contre cinq fils sans pause.
          # akirabox, lui, ne montre pas ce comportement et reste a cinq.
          if [ -f catalogue-au-depart.json ]; then
            nohup python3 scripts/lire_akirabox.py catalogue-au-depart.json --max 400                   --releves releve-akirabox.json > log-releve-akirabox.txt 2>&1 &
            echo $! > releve-akirabox.pid
            nohup python3 scripts/lire_akirabox.py catalogue-au-depart.json                   --hotes buzzheavier --max 250 --fils 2 --pause 1.5                   --releves releve-buzzheavier.json > log-releve-buzz.txt 2>&1 &
            echo $! > releve-buzz.pid
            # SONDE gofile + link-vault, ajoutee le 2026-08-30. Les deux sont
            # les derniers hebergeurs a 0 % nomme : 304 et 230 liens. Aucun
            # des deux ne se lit d'ici — gofile limite le debit par IP (son
            # API repond « error-rateLimit » plusieurs minutes durant, et sa
            # page est une SPA qui l'interroge), link-vault sert un defi
            # Cloudflare que le navigateur ne franchit pas non plus.
            # FlareSolverr et l'IP de la CI sont exactement ce qui manque.
            # CE QU'ON EN ATTEND EST MODESTE, et c'est mesure : gofile n'est
            # le SEUL lien d'aucune des 236 fiches ou il figure, link-vault
            # d'une seule sur 133. Les nommer ameliore leur etiquette, ça
            # n'ouvre aucun acces. Le parseur n'a jamais vu ces gabarits : ce
            # RESULTAT de la sonde, run 33312263583 : FlareSolverr LIT les deux.
            #   link-vault rend de vrais noms et de vraies tailles —
            #     « [ Remnant 2 ]-[DLPSGAME.COM].rar », 66 Go. Il est donc
            #     rentable, et passe en tete de la liste d'hotes.
            #   gofile est lisible mais son STOCK EST MORT : sur ~120 pages,
            #     une cinquantaine repond « Content not found ». Ce n'est pas
            #     un defaut de lecture — le JS a tourne et a rendu son verdict,
            #     comme le montre la distinction d'avec « Gofile — Cloud
            #     Storage Made Simple », le titre servi quand il n'a PAS
            #     tourne, vu 2 fois seulement.
            # Ces titres etaient ecrits tels quels dans fileName : le garde de
            # releves.py (ressemble_a_un_nom_de_fichier) les rejette desormais.
            nohup python3 scripts/lire_akirabox.py catalogue-au-depart.json --hotes link-vault,gofile --max 250 --fils 2 --pause 1.5 --releves releve-sondes.json > log-releve-sondes.txt 2>&1 &
            echo $! > releve-sondes.pid
          fi
          for n in lisibles akirabox buzz sondes; do
            [ -f releve-$n.pid ] || continue
            P=$(cat releve-$n.pid)
            E=0
            while kill -0 "$P" 2>/dev/null; do
              sleep 15; E=$((E + 15))
              if [ $E -ge 1500 ]; then
                echo "::warning::releve $n depasse 25 min — arret, on garde l'acquis."
                kill "$P" 2>/dev/null || true; sleep 3; break
              fi
            done
            echo "───── $n"; cat log-releve-$n.txt 2>/dev/null || true
          done
          # L'application est sequentielle et instantanee : c'est la COLLECTE
          # qui attendait le reseau, pas l'ecriture.
          if [ -f ps5-catalog.json ]; then
            python3 scripts/releves.py ps5-catalog.json releve-lisibles.json                     releve-akirabox.json releve-buzzheavier.json releve-sondes.json || true
          fi
          rm -f releve-*.json releve-*.pid log-releve-*.txt catalogue-au-depart.json

      - name: Nommer les fiches que la page source ne nomme pas
        if: env.MERGE_SKIPPED != '1'
        run: |
          # Les pages DLL de superpsx ne portent AUCUN nom de jeu : le slug dans
          # og:title et un h1 de widget de dons en barre laterale. On nomme donc
          # depuis Sony, par titleId — seule identite fiable de ces pages. Ne
          # touche que les titres juges sans valeur (vide, slug, libelle porte
          # par >= 3 titleId reels). Une panne de la source laisse le titre en
          # l'etat : elle ne doit pas casser le run.
          if [ -f ps5-catalog.json ]; then
            python3 scripts/name_from_titleid.py ps5-catalog.json || true
          fi

      # ──────────────────────────────────────────────────────────────
      # FINALISATION PEGASUS (formats visibles + assainissement tailles)
      # ──────────────────────────────────────────────────────────────
      - name: Finalize for Pegasus
        if: env.MERGE_SKIPPED != '1'
        run: |
          # ORDRE CRITIQUE : cette etape doit rester APRES les releves de noms,
          # de tailles et de titres. Elle CONSTRUIT les etiquettes a partir
          # d'eux — DLC, region, numero de partie, jeu contre correctif. Placee
          # avant, comme elle l'etait jusqu'au 2026-08-30, elle etiquetait sur
          # des donnees pas encore relevees : toute la mecanique restait inerte
          # en CI, alors qu'elle marchait en local ou les scripts tournaient
          # dans le bon ordre. Ne pas la remonter.
          # Surface le format (formatLabel + ligne "Format:" dans la description),
          # canonicalise fileFormat, retire les tailles aberrantes (> 2 To), et
          # nettoie les liens invalides. Idempotent.
          if [ -f ps5-catalog.json ]; then
            python3 scripts/pegasus_finalize.py ps5-catalog.json
          fi

      - name: Generate games list
        if: env.MERGE_SKIPPED != '1'
        run: |
          # Liste lisible de TOUS les jeux disponibles + leur format. Régénérée
          # à partir du catalogue cumulatif : chaque run l'enrichit des nouveaux
          # jeux sans perdre les anciens (merge non destructif + mémoire incr.).
          if [ -f ps5-catalog.json ]; then
            python3 scripts/build_games_list.py ps5-catalog.json \
              --md games-list.md --csv games-list.csv
          fi

      - name: Generate test catalog (3 small games)
        if: env.MERGE_SKIPPED != '1'
        run: |
          # Mini-catalogue à donner à un client : même structure que la
          # production, 3 jeux seulement, tirés au sort parmi les plus PETITS
          # pour qu'un test de téléchargement de bout en bout reste rapide.
          # Tirage non figé : la sélection change d'un run à l'autre.
          if [ -f ps5-catalog.json ]; then
            python3 scripts/build_test_catalog.py ps5-catalog.json \
              --out demo-3-games.json --count 3
          fi

      # ──────────────────────────────────────────────────────────────
      # MÉTRIQUES ET DIFF
      # ──────────────────────────────────────────────────────────────
      - name: Generate metrics and diff
        if: always()
        run: |
          if [ -f ps5-catalog.json ]; then
            python3 scripts/scrape_metrics.py metrics ps5-catalog.json --out scrape-metrics.json 2>/dev/null || true
          fi
          if [ -f ps5-catalog.previous.json ] && [ -f ps5-catalog.json ]; then
            python3 scripts/scrape_metrics.py diff ps5-catalog.previous.json ps5-catalog.json --out diff-report.json 2>/dev/null || true
            rm -f ps5-catalog.previous.json
          fi

      - name: Health check
        if: always()
        run: |
          if [ -f ps5-catalog.json ]; then
            python3 scripts/scrape_metrics.py health ps5-catalog.json --min-games 500 2>/dev/null || true
          fi

      - name: Show cache stats
        if: always()
        run: |
          if [ -d .scrape_cache ]; then
            echo "### Cache disque" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Fichiers en cache : $(ls .scrape_cache | wc -l)" >> $GITHUB_STEP_SUMMARY
            echo "- Taille : $(du -sh .scrape_cache | cut -f1)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d .scrape_cache_superpsx ]; then
            echo "- Cache SuperPSX : $(du -sh .scrape_cache_superpsx | cut -f1)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d .scrape_cache_api ]; then
            echo "- Cache API : $(du -sh .scrape_cache_api | cut -f1)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f .scrape_manifest_api.json ]; then
            echo "- Manifest API : $(python3 -c 'import json; d=json.load(open(".scrape_manifest_api.json")); print(len(d.get("entries",{})))' 2>/dev/null || echo '?') entrées" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f .scrape_manifest_superpsx.json ]; then
            echo "- Manifest SuperPSX : $(python3 -c 'import json; d=json.load(open(".scrape_manifest_superpsx.json")); print(len(d.get("entries",{})))' 2>/dev/null || echo '?') entrées" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Show summary
        if: always()
        run: |
          echo "### Catalogue généré" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ps5-catalog.json ]; then
            GAMES=$(python3 -c 'import json; print(len(json.load(open("ps5-catalog.json"))["packages"]))' 2>/dev/null || echo "0")
            SIZE=$(du -h ps5-catalog.json | cut -f1)
            echo "- Fichier : \`ps5-catalog.json\` ($SIZE)" >> $GITHUB_STEP_SUMMARY
            echo "- Nombre de jeux : **$GAMES**" >> $GITHUB_STEP_SUMMARY
            if [ "$GAMES" = "0" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠ **Aucun jeu scrapé** — vérifiez les logs du scraper." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- ⚠ Aucun fichier JSON généré" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f ps5-catalog.warnings.txt ]; then
            WARNINGS=$(wc -l < ps5-catalog.warnings.txt)
            echo "- Pages en échec : $WARNINGS" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f scrape-metrics.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Métriques" >> $GITHUB_STEP_SUMMARY
            python3 -c "
          import json
          m = json.load(open('scrape-metrics.json'))
          print(f\"- Jeux avec taille : {m.get('games_with_size', '?')}/{m.get('total_games', '?')}\")
          print(f\"- Jeux avec poster : {m.get('games_with_poster', '?')}\")
          print(f\"- Liens moyens/jeu : {m.get('avg_links_per_game', '?')}\")
          " 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          fi
          if [ -f diff-report.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Diff" >> $GITHUB_STEP_SUMMARY
            python3 -c "
          import json
          d = json.load(open('diff-report.json'))
          print(f\"- Ajoutés : {d.get('added', 0)} | Supprimés : {d.get('removed', 0)} | Modifiés : {d.get('updated', 0)}\")
          " 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Commit & push
        # ITEM 6 : on ne committe QUE si la fusion a réussi (MERGE_SKIPPED != 1).
        # Sur run dégradé/refusé ou aucune source fraîche, l'existant reste intact.
        if: env.MERGE_SKIPPED != '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "--- Fichiers présents ---"
          ls -la ps5-catalog.json ps5-catalog.warnings.txt scrape-metrics.json 2>&1 || true
          echo "--- git status (avant add) ---"
          git status --short

          git add -f ps5-catalog.json
          [ -f demo-3-games.json ] && git add -f demo-3-games.json || true
          [ -f ps5-catalog.warnings.txt ] && git add -f ps5-catalog.warnings.txt || true
          [ -f scrape-metrics.json ] && git add -f scrape-metrics.json || true
          [ -f games-list.md ] && git add -f games-list.md || true
          [ -f games-list.csv ] && git add -f games-list.csv || true

          # ITEM 2 : on versionne les manifests incrémentaux (last_run + 'modified'
          # par entrée) pour piloter le vrai incrémental entre runs.
          [ -f .scrape_manifest.json ] && git add -f .scrape_manifest.json || true
          [ -f .scrape_manifest_api.json ] && git add -f .scrape_manifest_api.json || true
          [ -f .scrape_manifest_superpsx.json ] && git add -f .scrape_manifest_superpsx.json || true
          [ -f .scrape_manifest_exfat.json ] && git add -f .scrape_manifest_exfat.json || true

          echo "--- git status (apres add) ---"
          git status --short

          if git diff --cached --quiet; then
            echo "Aucun changement a committer."
          else
            DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore(scrape): mise a jour catalogue PS5 ($DATE)"
            # Push robuste : un commit concurrent (ex. édition du README pendant
            # les ~30 min du run) fait avancer main → 'git push' simple est rejeté
            # (non-fast-forward). On rebase sur origin/main et on réessaie. Les
            # fichiers générés (catalogue/manifests) sont disjoints d'une édition
            # de doc → le rebase s'applique proprement.
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                echo "Push OK (tentative $attempt)"; break
              fi
              if [ "$attempt" = "5" ]; then
                echo "::error::Push échoué après 5 tentatives"; exit 1
              fi
              echo "Push refusé — rebase sur origin/main (tentative $attempt)…"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; echo "::error::Rebase impossible (conflit)"; exit 1; }
              sleep $((attempt * 3))
            done
          fi

          # URL publiques du catalogue, ajoutées au résumé du run (le résumé est
          # partagé entre steps : ce bloc atterrit sous « Catalogue généré »).
          # Écrit ICI et pas dans « Show summary » : ce step-là s'exécute AVANT
          # le push, l'URL n'y pointerait pas encore sur le contenu du run.
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          {
            echo ""
            echo "### URL du catalogue"
            echo ""
            echo '```'
            echo "$RAW/ps5-catalog.json"
            [ -f games-list.csv ] && echo "$RAW/games-list.csv"
            [ -f games-list.md ]  && echo "$RAW/games-list.md"
            echo '```'
            if [ -f demo-3-games.json ]; then
              echo ""
              echo "### Catalogue de TEST (3 petits jeux, à donner à un client)"
              echo ""
              echo '```'
              echo "$RAW/demo-3-games.json"
              echo '```'
              python3 -c "
          import json
          d = json.load(open('demo-3-games.json', encoding='utf-8'))
          for p in d['packages']:
              print(f\"- {p['title']} — {p.get('sizeBytes',0)/2**30:.2f} Go — {len(p.get('downloadLinks') or [])} liens\")
          " 2>/dev/null || true
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps5-catalog-catalog
          path: |
            ps5-catalog.json
            ps5-catalog.warnings.txt
            scrape-metrics.json
            diff-report.json
            games-list.md
            games-list.csv
          if-no-files-found: ignore
          retention-days: 14
